services:
  - type: web
    name: crumb-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBAPP_URL
        value: https://klogest.github.io/telegram-chess-miniapp/
      - key: AI_ENABLED
        value: "false"
